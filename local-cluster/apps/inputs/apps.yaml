# The apps deployed by the apps ResourceSet (mac-k8s/local-cluster/resourcesets/apps.yaml).
# Edit this file to add, change or remove an app. Applied by the apps-inputs Flux Kustomization.
#
# name:          app name, local-cluster/apps/<name> in mac-k8s
# namespace:     target namespace
# clusterConfig: true to deploy local-cluster/apps/config/<name> from this repository
# config:        string values added to the Flux postBuild substitutions. observabilityGitHubServer
#                is optional, manifests fall back to GitHubServer from the cluster-config ConfigMap
# secrets:       written to Vault at apps/<name>/<secret name> by deploy-apps.sh, not used by the
#                ResourceSet. Values must be environment variable references, e.g. ${MY_TOKEN}, set in
#                your bash profile. This file is committed and applied to the cluster as written, so
#                never put a secret value here
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: apps
  namespace: flux-system
spec:
  type: Static
  defaultValues:
    apps:
      - name: otel
        namespace: otel
        clusterConfig: true
        config:
          observabilityGitHubOrg: pc-dae
          observabilityGitHubRepo: observability
          observabilityBranch: develop
          suffix: "-otel" # Add a suffix to the cluster name and host name for the otel apps
          # Targets for the otel gateway, New Relic and Splunk default to true, VictoriaMetrics and Loki to false
          otelVictoriaMetrics: "true"
          otelLoki: "true"
          # Scrape kube-controller-manager and kube-scheduler, needs a Kind cluster created with the metrics extra
          otelControlPlaneComponents: "true"
        secrets:
          newrelic-key:
            licenseKey: ${NEWRELIC_LICENSE_KEY}
          splunk-hec-token:
            hecToken: ${SPLUNK_HEC_TOKEN}
