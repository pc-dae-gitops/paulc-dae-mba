---
# Helm values for the otel-node HelmRelease, see otel/node/otel-node/values.yaml in the observability repository
# The values.yaml key is merged over the chart defaults and cluster-config, the HelmRelease's inline values take precedence
# Flux postBuild substitution is applied to this file, so ${var} references are expanded, use $${var} for a literal ${var}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-node-values
  namespace: ${nameSpace}
data:
  values.yaml: |
    pipelines:
      kubeletstats:
        debug: false
      hostmetrics:
        debug: false
      self:
        debug: false
      otlp:
        debug: false
      cadvisor:
        debug: false
      hostmetrics_general:
        debug: false
      hostmetrics_free_memory:
        debug: false
      node_usage:
        debug: false
      nr_all:
        debug: false
      nr:
        debug: false
      logs:
        debug: false

    debug:
      enabled: false
      storage:
        size: 5Gi
      fileExporter:
        path: /var/lib/otelcol/debug
        rotation:
          max_megabytes: 10
          max_days: 2
          max_backups: 2