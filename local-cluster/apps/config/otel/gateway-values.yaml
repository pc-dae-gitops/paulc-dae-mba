---
# Helm values for the otel-gateway HelmRelease, see otel/gateway/otel-gateway/values.yaml in the observability repository
# The values.yaml key is merged over the chart defaults and cluster-config, the HelmRelease's inline values take precedence
# Flux postBuild substitution is applied to this file, so ${var} references are expanded, use $${var} for a literal ${var}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-values
  namespace: ${nameSpace}
data:
  values.yaml: |
    logging: # Log exporter setting
      enabled: false # Currently defaults to no logging

    pipelines:
      node:
        debug: false
      self:
        debug: false
      nr_all:
        debug: false
      nr:
        debug: false
      clf_logs:
        debug: false
      clf_audit_logs:
        debug: false
      node_logs:
        debug: false
      cluster_logs:
        debug: false
      controlplane_logs:
        debug: false
      splunk:
        debug: false
      k8s_events_newrelic:
        debug: false

    debug:
      enabled: false
      storage:
        size: 5Gi
      fileExporter:
        path: /var/lib/otelcol/debug
        rotation:
          max_megabytes: 10
          max_days: 2
          max_backups: 2
