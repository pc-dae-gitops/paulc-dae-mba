apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-source-otel
  namespace: null
spec:
  interval: 10m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: namespace-null
  path: ./local-cluster/apps/otel/source
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      nameSpace: null
      appName: otel
      # config values from apps.yaml

      observabilityBranch: migration
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
