apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-config-nr-agent
  namespace: newrelic
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: app-source-nr-agent
      namespace: newrelic
  path: ./local-cluster/apps/nr-agent/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      nameSpace: newrelic
      appName: nr-agent
      # config values from apps.yaml

      observabilityGitHubServer: github.com
      observabilityGitHubOrg: pc-dae
      observabilityGitHubRepo: observability
      observabilityBranch: develop
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
