apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-cluster-config-otel
  namespace: otel
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: app-config-otel
      namespace: otel
  path: ./local-cluster/apps/config/otel
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      nameSpace: otel
      appName: otel
      # config values from apps.yaml

      observabilityGitHubServer: github.com
      observabilityGitHubOrg: pc-dae
      observabilityGitHubRepo: observability
      observabilityBranch: develop
      suffix: -otel # Add a suffix to the cluster name and host name for the otel apps
      # Targets for the otel gateway, New Relic and Splunk default to true, VictoriaMetrics and Loki to false.
      # Splunk, VictoriaMetrics and Loki aren't deployed on crc.
      otelSplunk: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: otel-config
        optional: true
