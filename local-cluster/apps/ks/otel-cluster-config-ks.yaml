apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-cluster-config-otel
  namespace: otel
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: app-config-otel
      namespace: otel
  path: ./local-cluster/apps/config/otel
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substitute:
      nameSpace: otel
      appName: otel
      # config values from apps.yaml

      observabilityGitHubServer: github.com
      observabilityGitHubOrg: pc-dae
      observabilityGitHubRepo: observability
      observabilityBranch: devpaulc-dae-mba/resource-descriptions/apps.yamlelop
      # Targets for the otel gateway, New Relic and Splunk default to true, VictoriaMetrics and Loki to false
      otelVictoriaMetrics: "true"
      otelLoki: "true"
      # Scrape kube-controller-manager and kube-scheduler, needs a Kind cluster created with the metrics extra
      otelControlPlaneComponents: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: otel-config
        optional: true
