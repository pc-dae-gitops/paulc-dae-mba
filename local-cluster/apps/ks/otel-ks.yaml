apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-otel
  namespace: victoria-metrics
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: app-cluster-config-otel
      namespace: victoria-metrics
  path: ./local-cluster/apps/otel
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      nameSpace: victoria-metrics
      appName: otel
      # config values from apps.yaml

      observabilityGitHubServer: github.com
      observabilityGitHubOrg: pc-dae
      observabilityGitHubRepo: observability
      observabilityBranch: develop
      # Targets for the otel gateway, New Relic and Splunk default to true, VictoriaMetrics and Loki to false
      otelVictoriaMetrics: "true"
      otelLoki: "true"
      # Scrape kube-controller-manager and kube-scheduler, needs a Kind cluster created with the metrics extra
      otelControlPlaneComponents: "false"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: otel-config
        optional: true
      - kind: ConfigMap
        name: otel-cluster-config
        optional: true
