apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-splunk
  namespace: splunk
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  dependsOn:
    - name: app-config-splunk
      namespace: splunk
  path: ./local-cluster/apps/splunk
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      nameSpace: splunk
      appName: splunk
      # config values from apps.yaml

      observabilityGitHubServer: github.com
      observabilityGitHubOrg: pc-dae
      observabilityGitHubRepo: observability
      observabilityBranch: develop
      # The splunk/splunk image is amd64 only, the splunk kind extra pushes an arm64 relabelled copy to the local registry
      splunkImageRepository: localhost:5001/splunk
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
      - kind: ConfigMap
        name: splunk-config
        optional: true
      - kind: ConfigMap
        name: splunk-cluster-config
        optional: true
