apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: mac-k8s-config
  namespace: flux-system
spec:
  interval: 5m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/pc-dae-gitops/mac-k8s
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: core
  namespace: flux-system
spec:
  interval: 5m0s
  retryInterval: 30s
  timeout: 30s
  path: ./local-cluster
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: mac-k8s-config
  postBuild:
    substitute:
      dnsSuffix: 
      storageClass: hostpath
    substituteFrom:
      - kind: ConfigMap
        name: cluster-config
